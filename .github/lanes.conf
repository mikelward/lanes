# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# Markdown here is documentation and nothing else -- nothing packages it, and
# README.md, SPEC.md, and TODO.md describe behavior rather than produce it.
# There are no named exceptions: everything that is not markdown is code,
# including the workflows, the engine, the test files, and this policy file
# itself (which the engine hard-codes as code regardless of what it says).
docs **/*.md

# The one subject prefix the docs lane accepts. The wider housekeeping table
# in AGENTS.md (test:, build:, refactor:) names categories this lane can never
# actually admit: every file it accepts is markdown, so a commit that really
# was test, build, or refactor work would carry a non-markdown file and ride
# the code lane instead. Accepting those three would have the required gate
# blessing subjects that describe work the diff cannot contain.
prefixes docs

# ci.yml declares no workflow_dispatch trigger, so no dispatched run is
# legitimate here: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
