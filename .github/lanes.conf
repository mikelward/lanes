# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# README.md is the trap README.md's own "Writing your policy" section warns
# every consumer about: workflows.test.mjs reads and asserts on its content
# (the required-check name, the trusted-publishing example's shape) exactly
# the way that section's "JavaScript: a snapshot or fixture test that reads
# a .md file" bullet describes, so a docs-only skip on a README edit would
# let a broken consumer-facing example merge with nothing having run the one
# test that checks it. SPEC.md, TODO.md, and AGENTS.md carry no such trap --
# nothing reads their content in a test -- so they stay markdown-and-nothing-
# else, and everything that is not markdown is code, including the
# workflows, the engine, the test files, and this policy file itself (which
# the engine hard-codes as code regardless of what it says).
code README.md
docs **/*.md

# The one subject prefix the docs lane accepts. The wider housekeeping table
# in AGENTS.md (test:, build:, refactor:) names categories this lane can never
# actually admit: every file it accepts is markdown, so a commit that really
# was test, build, or refactor work would carry a non-markdown file and ride
# the code lane instead. Accepting those three would have the required gate
# blessing subjects that describe work the diff cannot contain.
prefixes docs

# ci.yml declares no workflow_dispatch trigger, so no dispatched run is
# legitimate here: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
