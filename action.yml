name: 'lanes'
description: >-
  Classify a pull request as docs or code, and gate the required check on a
  skip that was actually justified.

inputs:
  mode:
    description: >-
      'classify' to decide whether the heavy jobs may skip (sets the docs_only
      output), 'gate' to render the verdict the ruleset requires, or 'init' to
      post a `pending` status before anything else in the graph runs. The gate
      re-derives the classification itself rather than trusting the output, so
      a classification bug is a red check rather than a silent merge.
    required: true
  pr:
    description: >-
      The pull request number this run reports for. Empty on events that have
      none, which classify treats as code -- the safe direction, except on a
      push, where a policy carrying `push classify` classifies the range the
      push added instead. A dispatched
      run naming none is refused unless the policy allows it, since nothing
      would bind the verdict to the commit it labels.
    required: false
    default: ''
  classify-result:
    description: >-
      gate mode only. The classify job's result (needs.classify.result).
      Anything but success means nothing vouches for this diff.
    required: false
    default: ''
  results:
    description: >-
      gate mode only. Space-separated `job=result` pairs for every heavy job,
      e.g. "check=success msrv=skipped". Supplied by the caller so the engine
      carries no per-repo job names. An input naming NO jobs is refused rather
      than passed: it would otherwise report green having been told nothing.
    required: false
    default: ''
  base-sha:
    description: >-
      gate mode, dispatched runs only. The `base_sha` output classify recorded
      BEFORE the heavy jobs ran. A `pull_request` run takes this from its own
      event payload; a workflow_dispatch has no such record, so without it the
      gate could only read the base AFTER those jobs -- settling against
      itself and proving nothing. A PR-bound dispatch reaching the all-green
      path without it is refused rather than certified.
    required: false
    default: ''
  token:
    description: >-
      The token the engine reads the pull request with. Needs no more than
      read access to contents and pull requests; the default is the calling
      workflow's own.
    required: false
    default: ${{ github.token }}
  app-id:
    description: >-
      init mode always, gate mode optionally. The ID of a dedicated GitHub
      App whose identity a ruleset can restrict the required check to. `gate`
      mode still works exactly as before -- throw or return, no status posted
      -- when this and app-private-key are both empty; supply both to also
      publish the terminal status directly, authenticated as the App, rather
      than relying on the ambient Actions check-run. Never the ambient
      `github.token`: any workflow in the repository can mint that, which is
      the exact hole a dedicated App identity exists to close. Store both
      this and app-private-key in a GitHub Environment restricted to the
      trusted base ref, not a bare repository or organization secret -- see
      the README.
    required: false
    default: ''
  app-private-key:
    description: >-
      init mode always, gate mode optionally. The App's PEM private key. See
      app-id.
    required: false
    default: ''

outputs:
  docs_only:
    description: >-
      classify mode only. 'true' when every changed path is documentation by
      the policy's rules and the verdict can be trusted -- the pull request's
      files, or on an opted-in push the range it added -- 'false' otherwise --
      including every failure to establish it, so an unreadable diff runs the
      full lane.
  base_sha:
    description: >-
      classify mode only. The base branch tip as it stood before the heavy
      jobs ran. Feed it to the gate's `base-sha` input on a dispatched run;
      a `pull_request` run ignores it and uses its own event payload, which
      is the same commit recorded by a source the caller cannot get wrong.

# The policy lives at a FIXED path, `.github/lanes.conf`, and is not an input.
# Making it configurable meant the engine had to work out which file it was
# actually reading -- through symlinks, directory links, `..` segments and
# absolute spellings -- and each of those was a way to change the rules while
# the guard watched a different name. One name has none of them.
#
# `main.mjs` is a thin entry point that calls into `lanes.mjs` unconditionally.
# Pointing this at `lanes.mjs` instead would work only while that file carried
# an is-this-the-entry-point guard, and such a guard failing reads as success.
runs:
  using: 'node24'
  main: 'main.mjs'
